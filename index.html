<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Kanban</title>
<style>
  :root {
    --bg-main: #121418;
    --bg-card: #1e222b;
    --bg-column: #181b22;
    --border: #2d3342;
    --text-main: #f1f3f7;
    --text-muted: #8b949e;
    --accent: #4a72ff;
    --accent-hover: #3b5bdb;
    --purple: #9775fa;
    --danger: #e03131;
    --prio-high: #fa5252;
    --prio-med: #fd7e14;
    --prio-low: #51cf66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background-color: var(--bg-main); color: var(--text-main); padding: 24px; min-height: 100vh; }
  
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 1.35rem; font-weight: 700; }
  .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: var(--text-muted); }
  .breadcrumbs span.current { color: var(--text-main); font-weight: 600; }

  .header-actions { display: flex; gap: 8px; }

  button.btn-primary {
    background: var(--accent); color: white; border: none; padding: 9px 15px;
    border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; font-size: 0.85rem;
  }
  button.btn-primary:hover { background: var(--accent-hover); }
  button.btn-secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text-main);
    padding: 9px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
  }
  button.btn-secondary:hover { background: var(--bg-card); }
  button.btn-back { background: #252a36; border: 1px solid var(--border); color: var(--text-main); }

  .status-bar {
    font-size: 0.8rem; padding: 8px 12px; border-radius: 6px; margin-bottom: 20px;
    background: var(--bg-column); border: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center;
  }
  .sync-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .sync-active { background: #51cf66; }
  .sync-inactive { background: #fa5252; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-items: flex-start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .board { grid-template-columns: 1fr; } }

  .column {
    background: var(--bg-column); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; min-height: 500px; display: flex; flex-direction: column;
  }

  .column-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    font-size: 0.9rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px;
  }

  .task-list { display: flex; flex-direction: column; gap: 12px; flex-grow: 1; }

  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
    transition: all 0.2s ease;
  }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; user-select: none; }
  .card-top-left { display: flex; flex-direction: column; gap: 2px; }
  .card-title { font-weight: 700; font-size: 1rem; }
  .card-client { font-size: 0.85rem; color: var(--text-muted); }
  .card-contact { font-size: 0.8rem; color: var(--accent); text-decoration: none; margin-top: 2px; }
  
  .card-top-right { display: flex; align-items: center; gap: 6px; }
  .badge { padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
  .badge-high { background: rgba(250, 82, 82, 0.2); color: var(--prio-high); }
  .badge-med { background: rgba(253, 126, 20, 0.2); color: var(--prio-med); }
  .badge-low { background: rgba(81, 207, 102, 0.2); color: var(--prio-low); }
  .toggle-icon { font-size: 0.8rem; color: var(--text-muted); transition: transform 0.2s; }
  .card.collapsed .toggle-icon { transform: rotate(-90deg); }

  .card-body { display: flex; flex-direction: column; gap: 10px; }
  .card.collapsed .card-body { display: none; }

  .card-meta { display: flex; gap: 8px; font-size: 0.75rem; align-items: center; }
  .deadline { color: var(--text-muted); }

  /* Boks Notatek */
  .card-notes {
    background: rgba(0, 0, 0, 0.25);
    border-left: 3px solid var(--accent);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.8rem;
    color: #cbd5e1;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.35;
  }

  /* Przycisk Linku */
  .dropbox-link {
    display: flex; align-items: center; gap: 6px;
    background: rgba(74, 114, 255, 0.1); border: 1px solid rgba(74, 114, 255, 0.3);
    color: #668cff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem;
    text-decoration: none; font-weight: 600; transition: background 0.2s;
  }
  .dropbox-link:hover { background: rgba(74, 114, 255, 0.25); }

  /* Sub-Kanban Trigger */
  .subkanban-trigger {
    background: rgba(151, 117, 250, 0.1); border: 1px solid rgba(151, 117, 250, 0.3);
    color: var(--purple); padding: 8px 10px; border-radius: 6px; font-size: 0.8rem;
    font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    transition: background 0.2s;
  }
  .subkanban-trigger:hover { background: rgba(151, 117, 250, 0.2); }

  .subtasks { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
  .subtask-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .subtask-item input { cursor: pointer; accent-color: var(--accent); }
  .subtask-item.done span { text-decoration: line-through; color: var(--text-muted); }

  .card-actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 2px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05);
  }
  .card-actions-buttons { display: flex; gap: 8px; }
  .card-actions select {
    background: #14171d; color: var(--text-main); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font-size: 0.75rem;
  }
  .btn-action { background: transparent; border: none; font-size: 0.75rem; cursor: pointer; }
  .btn-edit { color: var(--accent); }
  .btn-delete { color: var(--danger); }

  /* Modale */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
    display: none; justify-content: center; align-items: center; padding: 16px; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px;
    max-height: 90vh; overflow-y: auto;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 0.8rem; color: var(--text-muted); }
  .form-group input, .form-group select, .form-group textarea {
    background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; color: var(--text-main); font-size: 0.9rem;
  }
  .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 6px; cursor: pointer; }

  /* Paleta Pastelowa */
  .color-picker { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .color-option {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform 0.15s, border-color 0.15s;
  }
  .color-option:hover { transform: scale(1.15); }
  .color-option.selected { border-color: #ffffff; transform: scale(1.15); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div id="navContainer"></div>
  </div>
  <div class="header-actions">
    <button class="btn-secondary" onclick="openSettingsModal()">⚙️ GitHub Sync</button>
    <button class="btn-primary" onclick="openProjectModal()">+ Nowa karta</button>
  </div>
</header>

<div class="status-bar">
  <div>
    <span id="syncIndicator" class="sync-indicator sync-inactive"></span>
    <span id="syncText">Synchronizacja: Wyłączona</span>
  </div>
  <button class="btn-secondary" style="padding: 3px 8px; font-size: 0.75rem;" onclick="loadFromGitHub()">Odśwież</button>
</div>

<div class="board">
  <div class="column" id="col-todo">
    <div class="column-header"><span>To Do</span><span class="count">0</span></div>
    <div class="task-list" id="list-todo"></div>
  </div>
  <div class="column" id="col-progress">
    <div class="column-header"><span>In Progress</span><span class="count">0</span></div>
    <div class="task-list" id="list-progress"></div>
  </div>
  <div class="column" id="col-done">
    <div class="column-header"><span>Done</span><span class="count">0</span></div>
    <div class="task-list" id="list-done"></div>
  </div>
  <div class="column" id="col-freezer">
    <div class="column-header"><span>Freezer ❄️</span><span class="count">0</span></div>
    <div class="task-list" id="list-freezer"></div>
  </div>
</div>

<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <h2 id="modalTitle">Dodaj nową kartę</h2>
    <input type="hidden" id="editProjectId">
    
    <div class="form-group">
      <label>Nazwa projektu / Tytuł utworu</label>
      <input type="text" id="trackTitle" placeholder="np. Płyta Andrzeja / Utwór 01" required>
    </div>

    <div class="form-group">
      <label>Kolor karty</label>
      <div class="color-picker" id="colorPickerContainer"></div>
      <input type="hidden" id="selectedColor" value="default">
    </div>

    <div class="form-group">
      <label>Notatki / Uwagi (rozliczenia, wytyczne itp.)</label>
      <textarea id="projectNotes" rows="3" placeholder="np. Zaliczka 50% wpłacona. Poprawki do miksu po stronie wokalistki..."></textarea>
    </div>

    <div class="form-group">
      <label>Link do plików (Dropbox / Cloud)</label>
      <input type="url" id="linkUrl" placeholder="https://www.dropbox.com/sh/...">
    </div>

    <div class="form-group">
      <label>Klient / Wykonawca</label>
      <input type="text" id="clientName" placeholder="np. Andrzej Kowalski">
    </div>
    
    <div class="form-group">
      <label>Kontakt / E-mail</label>
      <input type="text" id="clientContact" placeholder="np. kontakt@klient.pl lub tel.">
    </div>

    <div class="form-group">
      <label>Deadline</label>
      <input type="date" id="deadline">
    </div>

    <div class="form-group">
      <label>Priorytet</label>
      <select id="priority">
        <option value="3">Wysoki</option>
        <option value="2" selected>Średni</option>
        <option value="1">Niski</option>
      </select>
    </div>

    <div class="form-group">
      <label>Etapy / Checklist (każdy etap w nowej linii)</label>
      <textarea id="subtasks" rows="3" placeholder="Kompozycja&#10;Aranżacja&#10;Miks&#10;Mastering"></textarea>
    </div>

    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeProjectModal()">Anuluj</button>
      <button class="btn-primary" onclick="saveProject()">Zapisz</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>Ustawienia GitHub API</h2>
    <div class="form-group">
      <label>Nazwa użytkownika GitHub</label>
      <input type="text" id="ghUser" placeholder="np. octocat">
    </div>
    <div class="form-group">
      <label>Nazwa Repozytorium</label>
      <input type="text" id="ghRepo" placeholder="np. kanban-studio">
    </div>
    <div class="form-group">
      <label>Personal Access Token (PAT)</label>
      <input type="password" id="ghToken" placeholder="github_pat_...">
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeSettingsModal()">Anuluj</button>
      <button class="btn-primary" onclick="saveSettings()">Zapisz i Połącz</button>
    </div>
  </div>
</div>

<script>
  const PASTEL_COLORS = [
    { id: 'default', bg: '#1e222b', border: '#2d3342', name: 'Domyślny' },
    { id: 'blue',    bg: '#1b263b', border: '#415a77', name: 'Błękit' },
    { id: 'green',   bg: '#1b3225', border: '#2e5a44', name: 'Szałwia' },
    { id: 'purple',  bg: '#2a1b3d', border: '#442b63', name: 'Fiolet' },
    { id: 'amber',   bg: '#332415', border: '#5c4028', name: 'Bursztyn' },
    { id: 'rose',    bg: '#331b26', border: '#5c2d43', name: 'Róż' },
    { id: 'teal',    bg: '#162e2e', border: '#295252', name: 'Morski' },
    { id: 'slate',   bg: '#252a34', border: '#3b4252', name: 'Szary' }
  ];

  let rootProjects = [];
  let currentParentId = null;
  let fileSha = null;

  let ghConfig = JSON.parse(localStorage.getItem('gh_kanban_config')) || {
    user: '', repo: '', token: ''
  };

  function updateStatus(active, text) {
    document.getElementById('syncIndicator').className = `sync-indicator ${active ? 'sync-active' : 'sync-inactive'}`;
    document.getElementById('syncText').textContent = text;
  }

  function getActiveArray() {
    if (currentParentId === null) return rootProjects;
    const parent = rootProjects.find(p => p.id === currentParentId);
    if (!parent) { currentParentId = null; return rootProjects; }
    if (!parent.subKanban) parent.subKanban = [];
    return parent.subKanban;
  }

  function renderColorPicker(selectedId = 'default') {
    const container = document.getElementById('colorPickerContainer');
    container.innerHTML = '';
    PASTEL_COLORS.forEach(c => {
      const opt = document.createElement('div');
      opt.className = `color-option ${c.id === selectedId ? 'selected' : ''}`;
      opt.style.backgroundColor = c.bg;
      opt.style.borderColor = c.id === selectedId ? '#ffffff' : c.border;
      opt.title = c.name;
      opt.onclick = () => {
        document.getElementById('selectedColor').value = c.id;
        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
        opt.classList.add('selected');
      };
      container.appendChild(opt);
    });
  }

  function openProjectModal(editId = null) {
    const modalTitle = document.getElementById('modalTitle');
    const editIdInput = document.getElementById('editProjectId');
    const activeList = getActiveArray();

    if (editId) {
      const proj = activeList.find(p => p.id === editId);
      if (!proj) return;
      modalTitle.textContent = "Edytuj kartę";
      editIdInput.value = proj.id;
      document.getElementById('trackTitle').value = proj.title;
      document.getElementById('projectNotes').value = proj.notes || '';
      document.getElementById('linkUrl').value = proj.linkUrl || '';
      document.getElementById('clientName').value = proj.client || '';
      document.getElementById('clientContact').value = proj.contact || '';
      document.getElementById('deadline').value = proj.deadline || '';
      document.getElementById('priority').value = proj.priority || '2';
      document.getElementById('selectedColor').value = proj.color || 'default';
      document.getElementById('subtasks').value = (proj.subtasks || []).map(s => s.text).join('\n');
      renderColorPicker(proj.color || 'default');
    } else {
      modalTitle.textContent = currentParentId ? "Dodaj utwór / zadanie podrzędne" : "Dodaj nową kartę projektu";
      editIdInput.value = "";
      document.getElementById('trackTitle').value = '';
      document.getElementById('projectNotes').value = '';
      document.getElementById('linkUrl').value = '';
      document.getElementById('clientName').value = '';
      document.getElementById('clientContact').value = '';
      document.getElementById('deadline').value = '';
      document.getElementById('subtasks').value = '';
      document.getElementById('priority').value = '2';
      document.getElementById('selectedColor').value = 'default';
      renderColorPicker('default');
    }

    document.getElementById('projectModal').classList.add('active');
    document.getElementById('trackTitle').focus();
  }

  function closeProjectModal() {
    document.getElementById('projectModal').classList.remove('active');
  }

  function openSettingsModal() {
    document.getElementById('ghUser').value = ghConfig.user || '';
    document.getElementById('ghRepo').value = ghConfig.repo || '';
    document.getElementById('ghToken').value = ghConfig.token || '';
    document.getElementById('settingsModal').classList.add('active');
  }
  function closeSettingsModal() {
    document.getElementById('settingsModal').classList.remove('active');
  }

  function saveSettings() {
    ghConfig.user = document.getElementById('ghUser').value.trim();
    ghConfig.repo = document.getElementById('ghRepo').value.trim();
    ghConfig.token = document.getElementById('ghToken').value.trim();
    
    localStorage.setItem('gh_kanban_config', JSON.stringify(ghConfig));
    closeSettingsModal();
    loadFromGitHub();
  }

  async function loadFromGitHub() {
    if (!ghConfig.user || !ghConfig.repo || !ghConfig.token) {
      updateStatus(false, "Brak konfiguracji GitHub API.");
      return;
    }

    updateStatus(false, "Pobieranie danych...");
    const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/data.json`;

    try {
      const res = await fetch(url, {
        headers: {
          'Authorization': `token ${ghConfig.token}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (res.status === 404) {
        rootProjects = [];
        fileSha = null;
        updateStatus(true, "Połączono. Utworzono nową bazę.");
        renderBoard();
        return;
      }

      if (!res.ok) throw new Error(`Błąd HTTP: ${res.status}`);

      const data = await res.json();
      fileSha = data.sha;
      const decodedContent = decodeURIComponent(escape(atob(data.content)));
      rootProjects = JSON.parse(decodedContent);

      updateStatus(true, "Zsynchronizowano z GitHub.");
      renderBoard();
    } catch (err) {
      console.error(err);
      updateStatus(false, `Błąd: ${err.message}`);
    }
  }

  async function syncToGitHub() {
    renderBoard();
    if (!ghConfig.user || !ghConfig.repo || !ghConfig.token) return;

    updateStatus(false, "Zapisywanie na GitHubie...");
    const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/data.json`;
    
    const contentString = JSON.stringify(rootProjects, null, 2);
    const base64Content = btoa(unescape(encodeURIComponent(contentString)));

    const bodyData = {
      message: "Aktualizacja Kanban [Studio]",
      content: base64Content
    };
    if (fileSha) bodyData.sha = fileSha;

    try {
      const res = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${ghConfig.token}`,
          'Content-Type': 'application/json',
          'Accept': 'application/vnd.github.v3+json'
        },
        body: JSON.stringify(bodyData)
      });

      if (!res.ok) throw new Error(`Błąd zapisu: ${res.status}`);

      const resData = await res.json();
      fileSha = resData.content.sha;
      updateStatus(true, "Zapisano na GitHubie.");
    } catch (err) {
      console.error(err);
      updateStatus(false, `Błąd zapisu: ${err.message}`);
    }
  }

  function saveProject() {
    const title = document.getElementById('trackTitle').value.trim();
    if (!title) return alert('Wpisz tytuł!');

    const editId = document.getElementById('editProjectId').value;
    const notes = document.getElementById('projectNotes').value.trim();
    const linkUrl = document.getElementById('linkUrl').value.trim();
    const client = document.getElementById('clientName').value.trim();
    const contact = document.getElementById('clientContact').value.trim();
    const deadline = document.getElementById('deadline').value;
    const priority = parseInt(document.getElementById('priority').value);
    const color = document.getElementById('selectedColor').value;
    const rawSubtasks = document.getElementById('subtasks').value.split('\n');

    const activeList = getActiveArray();

    if (editId) {
      const proj = activeList.find(p => p.id === parseInt(editId));
      if (proj) {
        proj.title = title;
        proj.notes = notes;
        proj.linkUrl = linkUrl;
        proj.client = client;
        proj.contact = contact;
        proj.deadline = deadline;
        proj.priority = priority;
        proj.color = color;
        
        const oldMap = new Map((proj.subtasks || []).map(s => [s.text, s.done]));
        proj.subtasks = rawSubtasks
          .map(t => t.trim())
          .filter(t => t.length > 0)
          .map((text, idx) => ({ id: idx, text, done: oldMap.has(text) ? oldMap.get(text) : false }));
      }
    } else {
      const subtasks = rawSubtasks
        .map(t => t.trim())
        .filter(t => t.length > 0)
        .map((text, idx) => ({ id: idx, text, done: false }));

      const newProject = {
        id: Date.now(),
        title,
        notes,
        linkUrl,
        client,
        contact,
        deadline,
        priority,
        color,
        status: 'todo',
        collapsed: false,
        subtasks,
        subKanban: []
      };
      activeList.push(newProject);
    }

    closeProjectModal();
    syncToGitHub();
  }

  function openSubKanban(id) {
    currentParentId = id;
    renderBoard();
  }

  function exitSubKanban() {
    currentParentId = null;
    renderBoard();
  }

  function toggleCardCollapse(projId) {
    const proj = getActiveArray().find(p => p.id === projId);
    if (proj) {
      proj.collapsed = !proj.collapsed;
      syncToGitHub();
    }
  }

  function toggleSubtask(projId, subtaskId) {
    const proj = getActiveArray().find(p => p.id === projId);
    if (proj) {
      const task = proj.subtasks.find(s => s.id === subtaskId);
      if (task) task.done = !task.done;
      syncToGitHub();
    }
  }

  function moveProject(projId, targetStatus) {
    const proj = getActiveArray().find(p => p.id === projId);
    if (proj) {
      proj.status = targetStatus;
      syncToGitHub();
    }
  }

  function deleteProject(projId) {
    if (confirm('Usunąć tę kartę wraz ze wszystkimi jej danymi?')) {
      if (currentParentId === null) {
        rootProjects = rootProjects.filter(p => p.id !== projId);
      } else {
        const parent = rootProjects.find(p => p.id === currentParentId);
        if (parent) parent.subKanban = parent.subKanban.filter(p => p.id !== projId);
      }
      syncToGitHub();
    }
  }

  function getPriorityMeta(prio) {
    if (prio === 3) return { badgeClass: 'badge-high', label: 'Wysoki' };
    if (prio === 2) return { badgeClass: 'badge-med', label: 'Średni' };
    return { badgeClass: 'badge-low', label: 'Niski' };
  }

  function renderBoard() {
    const navContainer = document.getElementById('navContainer');
    if (currentParentId === null) {
      navContainer.innerHTML = `<h1>Studio Kanban</h1>`;
    } else {
      const parent = rootProjects.find(p => p.id === currentParentId);
      navContainer.innerHTML = `
        <div class="breadcrumbs">
          <button class="btn-secondary btn-back" onclick="exitSubKanban()">⬅ Wróć do tablicy głównej</button>
          <span>/</span>
          <span class="current">🗂️ ${parent ? parent.title : 'Sub-Kanban'}</span>
        </div>
      `;
    }

    const activeList = getActiveArray();
    const statuses = ['todo', 'progress', 'done', 'freezer'];
    
    statuses.forEach(status => {
      const listEl = document.getElementById(`list-${status}`);
      listEl.innerHTML = '';
      
      const filtered = activeList
        .filter(p => p.status === status)
        .sort((a, b) => b.priority - a.priority);

      document.querySelector(`#col-${status} .count`).textContent = filtered.length;

      filtered.forEach(p => {
        const prioInfo = getPriorityMeta(p.priority);
        const isCollapsed = p.collapsed ? 'collapsed' : '';
        const colorConfig = PASTEL_COLORS.find(c => c.id === (p.color || 'default')) || PASTEL_COLORS[0];

        const card = document.createElement('div');
        card.className = `card ${isCollapsed}`;
        card.style.backgroundColor = colorConfig.bg;
        card.style.borderColor = colorConfig.border;

        let subtasksHtml = (p.subtasks || []).map(s => `
          <label class="subtask-item ${s.done ? 'done' : ''}">
            <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtask(${p.id}, ${s.id})">
            <span>${s.text}</span>
          </label>
        `).join('');

        let contactHtml = '';
        if (p.contact) {
          const isMail = p.contact.includes('@');
          const href = isMail ? `mailto:${p.contact}` : `tel:${p.contact}`;
          contactHtml = `<a class="card-contact" href="${href}" onclick="event.stopPropagation()">✉️ ${p.contact}</a>`;
        }

        let linkHtml = '';
        if (p.linkUrl) {
          linkHtml = `
            <a href="${p.linkUrl}" target="_blank" rel="noopener" class="dropbox-link" onclick="event.stopPropagation()">
              <span>🔗 Otwórz Dropbox / Pliki</span>
            </a>
          `;
        }

        let notesHtml = '';
        if (p.notes) {
          notesHtml = `<div class="card-notes">📝 ${p.notes}</div>`;
        }

        let subKanbanBtnHtml = '';
        if (currentParentId === null) {
          const countDone = (p.subKanban || []).filter(item => item.status === 'done').length;
          const countTotal = (p.subKanban || []).length;
          const labelCount = countTotal > 0 ? ` (${countDone}/${countTotal} Done)` : '';
          
          subKanbanBtnHtml = `
            <div class="subkanban-trigger" onclick="event.stopPropagation(); openSubKanban(${p.id})">
              <span>🗂️ Otwórz Sub-Kanban (utwory)</span>
              <span>${labelCount} ➔</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="card-top" onclick="toggleCardCollapse(${p.id})">
            <div class="card-top-left">
              <div class="card-title">${p.title}</div>
              <div class="card-client">${p.client || 'Brak klienta'}</div>
              ${contactHtml}
            </div>
            <div class="card-top-right">
              <span class="badge ${prioInfo.badgeClass}">${prioInfo.label}</span>
              <span class="toggle-icon">▼</span>
            </div>
          </div>

          <div class="card-body">
            ${p.deadline ? `<div class="card-meta"><span class="deadline">📅 ${p.deadline}</span></div>` : ''}
            ${notesHtml}
            ${linkHtml}
            ${subKanbanBtnHtml}
            ${(p.subtasks && p.subtasks.length) ? `<div class="subtasks">${subtasksHtml}</div>` : ''}
            <div class="card-actions">
              <select onchange="moveProject(${p.id}, this.value)">
                <option value="todo" ${p.status === 'todo' ? 'selected' : ''}>To Do</option>
                <option value="progress" ${p.status === 'progress' ? 'selected' : ''}>In Progress</option>
                <option value="done" ${p.status === 'done' ? 'selected' : ''}>Done</option>
                <option value="freezer" ${p.status === 'freezer' ? 'selected' : ''}>Freezer</option>
              </select>
              <div class="card-actions-buttons">
                <button class="btn-action btn-edit" onclick="openProjectModal(${p.id})">Edytuj</button>
                <button class="btn-action btn-delete" onclick="deleteProject(${p.id})">Usuń</button>
              </div>
            </div>
          </div>
        `;
        listEl.appendChild(card);
      });
    });
  }

  if (ghConfig.user && ghConfig.repo && ghConfig.token) {
    loadFromGitHub();
  } else {
    renderBoard();
  }
</script>
</body>
</html>
